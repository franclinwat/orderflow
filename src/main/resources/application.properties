spring.application.name=orderflow-Package

# Adresse de la base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/orderflow_db

# Identifiants de connexion à MySQL
spring.datasource.username=root
spring.datasource.password=

# Demande à Hibernate de mettre à jour le schéma selon les entités
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL générées par Hibernate
spring.jpa.show-sql=true
